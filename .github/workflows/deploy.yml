name: Deploy examples to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            # The example consumes the library through `file:../history-adaptor`,
            # so both repositories must sit side by side in the workspace.
            - name: Checkout examples
              uses: actions/checkout@v4
              with:
                  path: history-adaptor-example

            - name: Checkout library
              uses: actions/checkout@v4
              with:
                  repository: ${{ github.repository_owner }}/history-adaptor
                  path: history-adaptor

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: |
                      history-adaptor/pnpm-lock.yaml
                      history-adaptor-example/pnpm-lock.yaml

            - name: Build library
              working-directory: history-adaptor
              run: |
                  pnpm install --frozen-lockfile
                  pnpm build

            - name: Build examples
              working-directory: history-adaptor-example
              env:
                  BASE_PATH: /${{ github.event.repository.name }}/
              run: |
                  pnpm install --force
                  pnpm build:pages

            - name: Deploy
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./history-adaptor-example/dist
                  publish_branch: gh-pages
